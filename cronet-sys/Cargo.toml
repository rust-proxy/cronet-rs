[package]
name = "cronet-sys"
version = "0.1.0"
edition = "2024"
description = "Low-level FFI bindings to Chromium Cronet (libcronet), with optional prebuilt-binary download."
license = "MIT"
repository = "https://github.com/Itsusinn/cronet-rs"
# Marks this as the single crate in the dependency graph that owns the native
# `cronet` library. Lets downstream `-sys` consumers pass metadata via DEP_CRONET_*.
links = "cronet"

[lib]

[dependencies]
# Dynamic mode: dlopen/LoadLibrary at runtime. Kept target-independent so every
# target compiles the same dynamic backend; Apple builds only use it when the
# `dynamic` feature is enabled.
libloading = "0.8"
same-file = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

# Build-time downloader deps — only pulled in when the `download` feature is on.
[build-dependencies]
ureq = { version = "2", optional = true, features = ["socks-proxy"] }
sha2 = { version = "0.10", optional = true }

[features]
default = []

# Load libcronet at runtime via dlopen/LoadLibrary. Wins over `static-link` on
# every target; Apple needs a user-supplied shared library for this.
dynamic = []

# Link libcronet at compile time (macOS/iOS/Android, also Linux/Windows).
static-link = []

# Opt-in: in build.rs, download the matching prebuilt libcronet for the target
# from github.com/rust-proxy/cronet-binaries into OUT_DIR, verifying its
# SHA-256 against a pinned checksum. Off by default — no network at build time.
download = ["dep:ureq", "dep:sha2"]

# Download only for the selected static backend.
download-static = ["dep:ureq", "dep:sha2"]
